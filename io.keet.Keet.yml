app-id: io.keet.Keet
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: keet

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # not possible to use XDG portal - https://github.com/electron/electron/issues/42608
  - --device=all
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: unappimage
    buildsystem: simple
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a

  - name: keet
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh "${FLATPAK_DEST}/bin/apply_extra"
      - install -Dm755 keet -t "${FLATPAK_DEST}/bin/"
      - install -Dm644 "${FLATPAK_ID}.desktop" -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 "${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo"
      - install -Dm644 "${FLATPAK_ID}.svg" -t "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps"
    sources:
      - type: script
        dest-filename: keet
        commands:
          - zypak-wrapper.sh /app/extra/keet/keet --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations "$@"

      - type: file
        path: io.keet.Keet.desktop
      - type: file
        path: io.keet.Keet.metainfo.xml
      - type: file
        path: io.keet.Keet.svg

      - type: extra-data
        only-arches: [x86_64]
        filename: keet.tar.gz
        url: https://static.keet.io/downloads/2.6.0/Keet-x64.tar.gz
        sha256: c168a182563bf7745681b82664e93782d9f10d23166ec48d2652e6cbe65d479e
        size: 23978555
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/
          version-pattern: href="([\d\.]+)/"
          url-template: https://static.keet.io/downloads/$version/Keet-x64.tar.gz

      - type: extra-data
        only-arches: [aarch64]
        filename: keet.tar.gz
        url: https://static.keet.io/downloads/2.6.0/Keet-arm64.tar.gz
        sha256: cb428106e77f8194e12fde16591faae5752f43b6c3aa9dcbe19630c0d6c98dba
        size: 23505967
        x-checker-data:
          type: html
          url: https://static.keet.io/downloads/
          version-pattern: href="([\d\.]+)/"
          url-template: https://static.keet.io/downloads/$version/Keet-arm64.tar.gz
